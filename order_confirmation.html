<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation - ShopNow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <h1 class="logo">ShopNow</h1>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="cart.html">Cart</a>
            <span id="auth-nav-slot"></span>
        </nav>
    </header>

    <main>
        <h1>Order Confirmation</h1>
        <p id="confirmation-message" aria-live="polite">Loading your order...</p>
        <p>Order number: <strong id="order-number"></strong></p>

        <div id="items" aria-live="polite"></div>
        <h3>Total: AED <span id="order-total">0.00</span></h3>

        <a href="products.html">Continue shopping</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script>
        const orderId = new URLSearchParams(window.location.search).get("id");
        const confirmationMessage = document.getElementById("confirmation-message");
        const itemsContainer = document.getElementById("items");

        async function loadConfirmation() {
            if (!orderId) {
                confirmationMessage.textContent = "No order number was provided.";
                return;
            }

            try {
                const user = await requireLogin();
                if (!user) return;

                const { data: order, error: orderError } = await supabaseClient
                    .from("order")
                    .select("order_id, customer_id, total")
                    .eq("order_id", orderId)
                    .maybeSingle();

                if (orderError) throw orderError;
                if (!order || order.customer_id !== user.id) {
                    confirmationMessage.textContent = "This order could not be found.";
                    return;
                }

                const { data: items, error: itemsError } = await supabaseClient
                    .from("order_item")
                    .select("quantity, price, product(name)")
                    .eq("order_id", orderId);

                if (itemsError) throw itemsError;

                document.getElementById("order-number").textContent = order.order_id;
                confirmationMessage.textContent = "Thank you! Your order has been confirmed.";

                if (!items || items.length === 0) {
                    itemsContainer.textContent = "No items were found for this order.";
                    document.getElementById("order-total").textContent =
                        Number(order.total).toFixed(2);
                    return;
                }

                const fragment = document.createDocumentFragment();
                items.forEach(item => {
                    const line = Number(item.price) * Number(item.quantity);
                    const productName = item.product?.name || "Product";
                    const row = document.createElement("p");
                    row.textContent =
                        `${productName} × ${item.quantity} — AED ${line.toFixed(2)}`;
                    fragment.appendChild(row);
                });
                itemsContainer.replaceChildren(fragment);
                document.getElementById("order-total").textContent =
                    Number(order.total).toFixed(2);
            } catch (error) {
                console.error("Could not load order confirmation:", error);
                confirmationMessage.textContent =
                    `Could not load your order: ${error.message}`;
                return;
            }
        }

        loadConfirmation();
    </script>
</body>
</html>
