<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ShopNow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <h1 class="logo">ShopNow</h1>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="cart.html">Cart</a>
            <span id="auth-nav-slot"></span>
        </nav>
    </header>

    <main>
        <h1>Checkout</h1>

        <h2>Order summary</h2>
        <div id="checkout-summary" aria-live="polite"></div>
        <p><a href="cart.html">Return to cart</a></p>

        <h2>Shipping information</h2>
        <form id="checkout-form">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" autocomplete="name" required>

            <label for="address">Address</label>
            <input type="text" id="address" name="address" autocomplete="street-address" required>

            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+971 50 123 4567" required>

            <button type="submit" id="place-order-btn">Place Order</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script>
        requireLogin();
    </script>
</body>
</html>
