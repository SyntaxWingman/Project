<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <h1 class="logo">ShopNow</h1>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="cart.html">Cart</a>
            <span id="auth-nav-slot"></span>
        </nav>
    </header>

    <h1>Login</h1>
    <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" required>

        <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="register.html">Register</a></p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById("login-form").addEventListener("submit", async e => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else {
                const requestedPage = new URLSearchParams(window.location.search).get("next");
                const allowedTarget = /^(index|products|cart|checkout)\.html$|^order_confirmation\.html\?id=[A-Za-z0-9_-]+$/.test(requestedPage || "");
                window.location.href = allowedTarget ? requestedPage : "products.html";
            }
        });
    </script>
</body>
</html>
